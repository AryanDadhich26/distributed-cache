name: distcache

services:
  node-0:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: distcache-node-0
    command: ["--port", "6000"]
    ports:
      - "6000:6000"

  node-1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: distcache-node-1
